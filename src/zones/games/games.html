<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Game — MIND/SPACE</title>
  <style>
    :root {
      --bg: #080808;
      --text: #F2EFE4;
      --accent: #E76F51;
      --soft: #333;
      --highlight: #F5C518;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Space Mono', monospace;
      background: radial-gradient(circle at top, rgba(231,111,81,0.16), transparent 40%),
                  radial-gradient(circle at bottom, rgba(245,197,24,0.08), transparent 35%),
                  var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrapper {
      width: min(960px, 100%);
      padding: 32px;
      border: 1px solid rgba(242,239,228,0.1);
      border-radius: 24px;
      background: rgba(10,10,10,0.96);
      box-shadow: 0 40px 80px rgba(0,0,0,0.25);
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 4vw, 4rem);
      margin: 0 0 12px;
      letter-spacing: 0.1em;
    }
    p { margin: 0 0 28px; line-height: 1.7; color: rgba(242,239,228,0.7); }
    .game-area {
      display: grid;
      gap: 20px;
      margin-bottom: 32px;
    }
    .score-board {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      padding: 14px 18px;
      border: 1px solid rgba(242,239,228,0.12);
      border-radius: 14px;
      min-width: 140px;
      text-align: center;
      font-size: 0.85rem;
    }
    .target {
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(242,239,228,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .letters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 14px;
    }
    .letter {
      padding: 24px 0;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(242,239,228,0.12);
      color: var(--text);
      text-align: center;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .letter:hover { transform: translateY(-3px); border-color: rgba(231,111,81,0.6); }
    .letter.used {
      background: rgba(255,255,255,0.08);
      color: rgba(242,239,228,0.4);
      cursor: default;
      border-color: rgba(242,239,228,0.06);
    }
    .message {
      margin: 0;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(242,239,228,0.05);
      color: var(--highlight);
      min-height: 54px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-start;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(242,239,228,0.14);
      background: rgba(255,255,255,0.04);
      transition: background 0.2s, border-color 0.2s;
    }
    .btn:hover { background: rgba(231,111,81,0.16); border-color: rgba(231,111,81,0.45); }
    .btn.primary { background: var(--accent); color: #111; border-color: transparent; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>LANGUAGE GAME</h1>
    <p>Build the hidden word by selecting the correct letters in order. Solve three rounds to win the language challenge.</p>

    <div class="score-board">
      <div class="badge">Round: <strong id="round">1</strong>/3</div>
      <div class="badge">Score: <strong id="score">0</strong></div>
    </div>

    <div class="game-area">
      <div class="target" id="targetWord">_ _ _ _ _</div>
      <div class="letters" id="letters"></div>
      <p class="message" id="message">Select letters to spell the hidden word.</p>
    </div>

    <div class="controls">
      <a class="btn primary" id="resetBtn">Restart Round</a>
      <a class="btn" href="index.html">Back to Games Home</a>
      <a class="btn" href="../../../index.html">Back to Brain</a>
    </div>
  </div>

  <script>
    const words = ["WORDS", "SPEAK", "VOICE", "WRITE", "STORY"];
    const base = document.getElementById('letters');
    const targetEl = document.getElementById('targetWord');
    const message = document.getElementById('message');
    const roundEl = document.getElementById('round');
    const scoreEl = document.getElementById('score');
    const resetBtn = document.getElementById('resetBtn');

    let current = null;
    let selected = [];
    let round = 1;
    let score = 0;

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function startRound() {
      current = words[Math.floor(Math.random() * words.length)];
      selected = [];
      roundEl.textContent = round;
      targetEl.textContent = current.split('').map(() => '_').join(' ');
      message.textContent = 'Select letters to spell the hidden word.';
      scoreEl.textContent = score;
      buildLetters();
    }

    function buildLetters() {
      base.innerHTML = '';
      const letters = shuffle(current.split(''));
      letters.forEach((letter) => {
        const btn = document.createElement('div');
        btn.className = 'letter';
        btn.textContent = letter;
        btn.addEventListener('click', () => selectLetter(btn, letter));
        base.appendChild(btn);
      });
    }

    function selectLetter(btn, letter) {
      if (btn.classList.contains('used')) return;
      selected.push(letter);
      btn.classList.add('used');
      updateTarget();
      checkWord();
    }

    function updateTarget() {
      targetEl.textContent = selected.map(l => l).concat(Array(current.length - selected.length).fill('_')).join(' ');
    }

    function checkWord() {
      if (selected.length !== current.length) return;
      const attempt = selected.join('');
      if (attempt === current) {
        score += 10;
        scoreEl.textContent = score;
        message.textContent = 'Correct! Great language intuition. Loading next round...';
        round += 1;
        if (round > 3) {
          message.textContent = 'You won the Language Game! Well done.';
          resetBtn.textContent = 'Play Again';
        }
        setTimeout(() => {
          if (round <= 3) startRound();
        }, 1200);
      } else {
        message.textContent = 'That spelling is not correct yet. Try again!';
      }
    }

    resetBtn.addEventListener('click', () => {
      if (round > 3) {
        round = 1;
        score = 0;
      }
      startRound();
    });

    startRound();
  </script>
</body>
</html>
